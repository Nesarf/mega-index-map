name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Repository invariants: English/ASCII (the only non-ASCII allowed is the functional CJK regexes
  # in SENSITIVE_PATTERNS) plus a consistency proofread of docs vs code, op lists, parameter
  # wiring and the no-network rule. Cheap and dependency-free, so it runs on every push and tag.
  invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: English/ASCII invariant
        run: node scripts/check-ascii.mjs
      - name: Consistency proofread
        run: node scripts/check-consistency.mjs

  # npm publishing is opt-in: set the repository variable NPM_PUBLISH=true (and configure a
  # Trusted Publisher for this repository on npmjs.com, or add an NPM_TOKEN secret) to enable
  # it. Without that the job is skipped instead of failing on every push to main.
  npm:
    needs: invariant
    if: ${{ github.ref == 'refs/heads/main' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', registry-url: 'https://registry.npmjs.org' }
      - name: Prepare npm for OIDC
        run: |
          npm install -g npm@latest
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"; fi
      - name: Check version
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/mega-index-map/${VERSION}")
          echo "exists=$([ "$CODE" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public --registry https://registry.npmjs.org --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # A GitHub Release is cut from a version tag (push v*). Notes are built from the commits
  # since the previous tag, so they are meaningful without pull requests.
  release:
    needs: invariant
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE=$([ -n "$PREV" ] && echo "${PREV}..${TAG}" || echo "${TAG}")
          {
            echo "Cross-workspace interop Library for DeepSeek Harness: record, index and search files,"
            echo "tools, environments, knowledge and work records across workspaces - plugin bundle, no build step."
            echo
            echo "Install: \`dsh plugin --profile web add github:${GITHUB_REPOSITORY}\`"
            echo
            echo "## What's Changed"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > release_notes.md
          cat release_notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && exit 0
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release_notes.md --verify-tag
